<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gap Calculator</title>

<!-- APP ICON & THEME SETTINGS -->
<meta name="theme-color" content="#0F0F0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Gap Calc">

<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Gap%20Calculator%22%2C%22short_name%22%3A%22Gap%20Calc%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230F0F0F%22%2C%22theme_color%22%3A%22%230F0F0F%22%7D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0F0F0F;
  --surface: #1A1A1A;
  --surface-active: #252525;
  --primary: #FF9F1C; 
  --text-main: #FFFFFF;
  --text-secondary: #A1A1A1;
  --border: #333333;
  --success: #4ADE80;
  --warning-bg: rgba(239, 68, 68, 0.12);
  --warning-border: #EF4444;
  --warning-text: #FCA5A5;
  --error: #EF4444;
  --radius: 8px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  height: 100%;
  margin: 0;
  padding: 0;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', sans-serif;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* FIX: Ensure hidden blocks stay hidden */
.hidden { display: none !important; }

/* MAIN SCROLLABLE APP AREA */
.app-scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: padding-bottom 0.2s ease;
}

.container {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.header {
  margin-bottom: 2px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  margin: 0;
  text-transform: uppercase;
  color: var(--text-main);
}

.header p {
  font-size: 12px;
  color: var(--primary);
  margin-top: 4px;
  margin-bottom: 0;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.help-btn {
  background: var(--surface);
  color: var(--primary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: background 0.1s;
}
.help-btn:active { background: var(--surface-active); }

/* STYLED LANGUAGE SELECTOR */
.lang-select-wrapper {
  position: relative;
  color: var(--text-secondary);
}

.lang-select-wrapper:focus-within {
  color: var(--primary);
}

.lang-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  pointer-events: none;
}

.lang-select {
  appearance: none;
  -webkit-appearance: none;
  background: var(--surface);
  color: var(--text-main);
  border: 1px solid var(--border);
  padding: 8px 24px 8px 30px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
  font-family: 'Inter', sans-serif;
  transition: border-color 0.2s, background 0.2s;
}

.lang-select:focus {
  border-color: var(--primary);
  background: var(--surface-active);
}

.lang-select-wrapper::after {
  content: "▼";
  font-size: 9px;
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: inherit;
  transition: color 0.2s;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.input-group { display: flex; flex-direction: column; gap: 6px; }

label {
  font-size: 11px;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  font-weight: 600;
}

input {
  width: 100%;
  padding: 14px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-main);
  font-size: 15px;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}

input.active-input {
  background: var(--surface-active) !important;
  border-color: var(--primary) !important;
  box-shadow: 0 0 0 1px var(--primary) !important;
}

.segmented-control {
  background: var(--surface);
  padding: 4px;
  border-radius: var(--radius);
  display: flex;
  gap: 4px;
  border: 1px solid var(--border);
}

.segment-label {
  flex: 1;
  text-align: center;
  padding: 10px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-secondary);
  border-radius: 6px;
  font-weight: 500;
  user-select: none;
}

.segment-label:has(input:checked) {
  background: var(--surface-active);
  color: var(--primary);
  font-weight: 600;
}
.segmented-control input { display: none; }

button.calc-btn {
  width: 100%;
  padding: 16px;
  font-size: 14px;
  border: none;
  border-radius: var(--radius);
  background: var(--primary);
  color: #000;
  font-weight: 700;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 4px;
  letter-spacing: 0.5px;
}
button.calc-btn:active { opacity: 0.9; }

/* OUTPUT RESULTS PANEL */
.result-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display: none;
  flex-direction: column;
  gap: 14px;
}
.result-panel.visible { display: flex; animation: fadeUp 0.3s ease; }

/* 1. TOP CONVERSATIONAL SUMMARY MESSAGE */
.friendly-msg-card {
  background: rgba(255, 159, 28, 0.12);
  border: 1px solid rgba(255, 159, 28, 0.4);
  border-left: 4px solid var(--primary);
  border-radius: 8px;
  padding: 14px 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.friendly-msg-card .msg-icon {
  font-size: 20px;
  line-height: 1.2;
}
.friendly-msg-card .msg-text {
  font-size: 13.5px;
  color: #F3F3F3;
  line-height: 1.55;
  font-weight: 500;
}
.friendly-msg-card .msg-text strong {
  color: var(--primary);
  font-weight: 700;
}

/* 2. WARNING BANNER: MARK GAPS FIRST */
.warning-alert-card {
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  border-left: 4px solid var(--warning-border);
  border-radius: 8px;
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.warning-alert-card .warn-icon {
  font-size: 18px;
  line-height: 1.2;
}
.warning-alert-card .warn-body {
  font-size: 12.5px;
  color: var(--warning-text);
  line-height: 1.5;
  font-weight: 500;
}
.warning-alert-card .warn-body strong {
  color: #FFFFFF;
  font-weight: 700;
}

/* 3. MEASUREMENT CARD */
.primary-card {
  background: #111111;
  border: 1px solid #2a2a2a;
  border-left: 4px solid var(--primary);
  border-radius: 6px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.primary-card .card-title {
  font-size: 11px;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  font-weight: 600;
}

.primary-card .main-val {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.2;
}

.unit-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.pill {
  background: #222222;
  border: 1px solid #333333;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  color: #dddddd;
}
.pill span { color: var(--text-secondary); font-weight: 500; }

.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat-box {
  background: #141414;
  border: 1px solid #262626;
  border-radius: 6px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stat-label { font-size: 10px; color: var(--text-secondary); font-weight: 600; }
.stat-val { font-size: 14px; color: var(--text-main); font-weight: 600; }

.diff-card {
  background: #141414;
  border: 1px solid #262626;
  border-radius: 6px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.diff-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.diff-title {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 600;
}

.diff-main-val {
  font-size: 14px;
  font-weight: 600;
}

.status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; }
.status-success { background: rgba(74, 222, 128, 0.1); color: var(--success); }
.status-warn { background: rgba(250, 204, 21, 0.1); color: #FACC15; }

.footer { margin-top: 16px; text-align: center; font-size: 11px; color: #444; font-weight: 500; padding-bottom: 10px; }

/* DOCKED VIRTUAL KEYBOARD */
.kb-docked-container {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  background: #121212;
  border-top: 1px solid #2e2e2e;
  box-shadow: 0 -8px 24px rgba(0,0,0,0.85);
  padding: 8px 10px 10px;
  display: none;
  flex-direction: column;
  gap: 5px;
  flex-shrink: 0;
  z-index: 100;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
}

.kb-docked-container.active {
  display: flex;
}

.kb-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 4px;
  border-bottom: 1px solid #222;
}

.kb-title {
  font-size: 11px;
  color: var(--primary);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.kb-badge {
  font-size: 10px;
  color: var(--text-secondary);
  background: #1e1e1e;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
}

.kb-section-title {
  font-size: 9px;
  color: var(--text-secondary);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.frac-grid-7 {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.frac-grid-8 {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
}

.numpad-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}

.kb-btn {
  background: var(--surface);
  color: var(--text-main);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 0;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  transition: background 0.1s, transform 0.05s, border-color 0.1s;
}

.kb-btn:active {
  background: var(--surface-active);
  border-color: var(--primary);
  transform: scale(0.95);
}

.kb-btn.frac-btn {
  background: rgba(255, 159, 28, 0.12);
  color: var(--primary);
  border-color: rgba(255, 159, 28, 0.35);
  font-size: 14px;
  font-weight: 700;
  padding: 7px 0;
}

.kb-btn.frac-16 {
  font-size: 12px;
  padding: 7px 0;
}

.kb-btn.accent {
  background: rgba(255, 159, 28, 0.2);
  color: var(--primary);
  border-color: rgba(255, 159, 28, 0.5);
  font-weight: 700;
}

.kb-btn.action {
  background: #222222;
  color: var(--text-secondary);
  font-size: 12px;
}

.kb-nav-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr;
  gap: 6px;
  margin-top: 2px;
}

.kb-btn.done-btn {
  background: var(--primary);
  color: #000;
  font-weight: 700;
  border: none;
}

/* -------------------------------------------------------------
   SELF-CONTAINED WALKTHROUGH MODAL (ZERO OVERLAPPING)
   ------------------------------------------------------------- */
.walkthrough-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 5000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.walkthrough-overlay.hidden { display: none; }

.walkthrough-modal {
  background: #161616;
  border: 1px solid #333333;
  border-top: 4px solid var(--primary);
  border-radius: 18px;
  width: 100%;
  max-width: 410px;
  padding: 22px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 16px 50px rgba(0,0,0,0.9);
  animation: zoomUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.wt-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.wt-step-pill {
  background: rgba(255, 159, 28, 0.15);
  color: var(--primary);
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.wt-close-btn {
  background: none;
  border: none;
  color: #888;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 8px;
}
.wt-close-btn:hover { color: #fff; }

.wt-title {
  font-size: 16px;
  font-weight: 700;
  color: #FFFFFF;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.wt-mockup-box {
  background: #0D0D0D;
  border: 1px solid #282828;
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.wt-mockup-label {
  font-size: 10px;
  color: var(--primary);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.wt-mockup-field {
  background: #1D1D1D;
  border: 1.5px solid var(--primary);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 15px;
  font-weight: 700;
  color: #FFF;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.wt-mockup-field .sub-note {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
}

.wt-content {
  font-size: 14px;
  color: #D1D1D1;
  line-height: 1.6;
  font-weight: 400;
  min-height: 85px;
}
.wt-content strong { color: var(--primary); font-weight: 700; }

.tour-example-tag {
  display: inline-block;
  background: rgba(255, 159, 28, 0.2);
  color: var(--primary);
  border: 1px solid rgba(255, 159, 28, 0.5);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 13px;
  font-weight: 700;
  margin: 1px 2px;
}

.wt-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  padding-top: 12px;
  border-top: 1px solid #252525;
}

.wt-dots {
  display: flex;
  gap: 5px;
}
.wt-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #3a3a3a;
  transition: all 0.2s ease;
}
.wt-dot.active {
  background: var(--primary);
  width: 18px;
  border-radius: 10px;
}

.wt-actions {
  display: flex;
  gap: 8px;
}

.wt-btn {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  border: none;
  transition: transform 0.1s;
}
.wt-btn:active { transform: scale(0.96); }

.wt-btn-back {
  background: #252525;
  color: #AAA;
}
.wt-btn-back:disabled {
  opacity: 0.3;
  cursor: default;
}
.wt-btn-next {
  background: var(--primary);
  color: #000;
}

@keyframes zoomUp {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<body>

<!-- SCROLLABLE FORM & RESULTS AREA -->
<div id="appScrollArea" class="app-scroll-area">
  <div class="container">
    <div class="header">
      <div>
        <h1 data-i18n="title">GAP CALCULATOR</h1>
        <p>By Tajmul</p>
      </div>
      <div class="header-actions">
        <button class="help-btn" onclick="startWalkthrough(0)">
          <span>❓</span> <span data-i18n="btn_help">Help</span>
        </button>
        <div class="lang-select-wrapper">
          <span class="lang-icon">🌐</span>
          <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="hi">हिंदी</option>
            <option value="bn">বাংলা</option>
            <option value="mr">मराठी</option>
            <option value="gu">ગુજરાતી</option>
            <option value="or">ଓଡ଼ିଆ</option>
            <option value="te">తెలుగు</option>
            <option value="ta">தமிழ்</option>
          </select>
        </div>
      </div>
    </div>

    <!-- UNIT SYSTEM SELECTOR -->
    <div class="input-group">
      <label data-i18n="unit_sys">Unit System / माप तरीका</label>
      <div class="segmented-control">
        <label class="segment-label">
          <input type="radio" name="unit" value="inch" checked onchange="toggleUnits()">
          <span data-i18n="inch_null">Inch</span>
        </label>
        <label class="segment-label">
          <input type="radio" name="unit" value="mm" onchange="toggleUnits()">
          Millimeter (MM)
        </label>
      </div>
    </div>

    <!-- Inside Size (Total Span) -->
    <div class="input-group">
      <label id="lbl-frame" data-i18n="total_span">Inside Size (Total Span)</label>
      <input id="frame" type="text" placeholder='e.g. 44" or 44 ¾"' readonly>
    </div>

    <!-- Pipe / Material Thickness -->
    <div class="input-group">
      <label id="lbl-bar" data-i18n="mat_od">Pipe / Material Thickness (O.D.)</label>
      <input id="bar" type="text" placeholder='e.g. 3/4"' readonly>
    </div>

    <!-- Calculation Method Switcher -->
    <div class="input-group" style="margin-top:4px;">
      <label data-i18n="calc_method">Calculation Method</label>
      <div class="segmented-control">
        <label class="segment-label">
          <input type="radio" name="mode" value="gap" checked onchange="toggleInputs()">
          <span data-i18n="opt_gap">Auto Gap</span>
        </label>
        <label class="segment-label">
          <input type="radio" name="mode" value="pipe" onchange="toggleInputs()">
          <span data-i18n="fix_qty">Fixed Pieces</span>
        </label>
      </div>
    </div>

    <!-- Auto Gap Inputs -->
    <div id="gapInputs" class="grid-2">
      <div class="input-group">
        <label id="lbl-gapStart" data-i18n="min_gap">Min Gap (Min)</label>
        <input id="gapStart" type="text" placeholder='e.g. 3"' readonly>
      </div>
      <div class="input-group">
        <label id="lbl-gapMax" data-i18n="max_gap">Max Gap (Max)</label>
        <input id="gapMax" type="text" placeholder='e.g. 4 ¾"' readonly>
      </div>
    </div>

    <!-- Fixed Pieces Input -->
    <div id="pipeInputs" class="input-group hidden">
      <label data-i18n="qty_req">How many pieces required?</label>
      <input id="pipeCount" type="text" placeholder="10" readonly>
    </div>

    <!-- Calculate Button -->
    <div>
      <button class="calc-btn" onclick="calculate()" data-i18n="btn_calc">Calculate</button>
    </div>

    <!-- Results Panel -->
    <div id="outputPanel" class="result-panel">
      <div id="outputContent"></div>
    </div>

    <div class="footer" data-i18n="footer">© Gap Calculator By Tajmul</div>
  </div>
</div>

<!-- DOCKED VIRTUAL INCH & FRACTION KEYBOARD -->
<div id="customKb" class="kb-docked-container">
  <div class="kb-bar">
    <span id="kbTargetTitle" class="kb-title">EDITING INPUT</span>
    <span id="kbUnitBadge" class="kb-badge">INCH MODE</span>
  </div>
  
  <div id="kbGridContainer"></div>

  <div class="kb-nav-row">
    <button class="kb-btn action" onpointerdown="preventBlur(event)" onclick="navField(-1)" data-i18n="prev">◄ Prev</button>

const NULL = 1/8, HALF_NULL = NULL / 2;
const MM_TO_INCH = 1 / 25.4;
let activeInput = null;

function replaceUnicodeFractions(s) {
  const fracMap = {
    '½': ' 1/2', '¼': ' 1/4', '¾': ' 3/4',
    '⅛': ' 1/8', '⅜': ' 3/8', '⅝': ' 5/8', '⅞': ' 7/8',
    '⅓': ' 1/3', '⅔': ' 2/3'
  };
  s = s.replace(/[½¼¾⅛⅜⅝⅞⅓⅔]/g, m => fracMap[m] || m);
  s = s.replace(/\b(half|आधा|আধা|અડધો|ଅଧା|సగం|அரை)\b/gi, ' 1/2 ');
  return s;
}

function evalSegment(str) {
  str = str.trim();
  if (!str) return 0;
  let parts = str.split(/\s+/);
  let total = 0;
  for (let p of parts) {
    if (p.includes('/')) {
      let [num, den] = p.split('/');
      let n = parseFloat(num), d = parseFloat(den);
      if (!isNaN(n) && !isNaN(d) && d !== 0) total += n / d;
    } else {
      let n = parseFloat(p);
      if (!isNaN(n)) total += n;
    }
  }
  return total;
}

function parseMeasurement(input, unitMode) {
  if (input === null || input === undefined) return NaN;
  let s = input.toString().trim();
  if (!s) return NaN;

  s = replaceUnicodeFractions(s).toLowerCase();

  if (s.includes('mm')) {
    let numStr = s.replace(/mm/g, '').trim();
    let mmVal = evalSegment(numStr);
    return isNaN(mmVal) ? NaN : mmVal * MM_TO_INCH;
  }

  let hasInchKeyword = /(?:"|inch|in\b|इंच|ઇંચ|ইঞ্চি|ଇଞ୍ଚ|ఇంచ్|இன்ச்)/i.test(s);
  let hasNullKeyword = /null|sut|soot|doro|सूत|દોરો|દોરા|સુતા|সুতা|ସୁତା|సూత్|நூல்/i.test(s);

  if (unitMode === 'mm' && !hasInchKeyword && !hasNullKeyword) {
    let mmVal = evalSegment(s);
    return isNaN(mmVal) ? NaN : mmVal * MM_TO_INCH;
  }

  let totalInches = 0;
  let parsedAny = false;

  if (hasInchKeyword || hasNullKeyword) {
    let inchMatch = s.match(/(.*?)(?:"|inch|in\b|इंच|ઇંચ|ইঞ্চি|ଇଞ୍ଚ|ఇంచ్|இன்ச்)/i);
    if (inchMatch) {
      let inchVal = evalSegment(inchMatch[1]);
      totalInches += inchVal;
      parsedAny = true;
      s = s.replace(inchMatch[0], '');
    }

    let nullMatch = s.match(/(.*?)(?:null|sut|soot|doro|सूत|દોરો|દોરા|સુતા|সুতা|ସୁତା|సూత్|நூல்)/i);
    if (nullMatch) {
      let nullVal = evalSegment(nullMatch[1]);
      totalInches += nullVal * NULL;
      parsedAny = true;
    }

    if (parsedAny) return totalInches;
  }

  let val = evalSegment(s);
  return isNaN(val) ? NaN : val;
}

function toInchNull(x) {
  const nullStr = getNullStr();
  const inchStr = getInchStr();
  
  if (Math.abs(x) < 0.0001) return `0 ${inchStr}`;
  let inch = Math.floor(x);
  let remNull = (x - inch) * 8;
  remNull = Math.round(remNull * 100) / 100;
  
  let nullInt = Math.floor(remNull);
  let nullFrac = remNull - nullInt;
  let remNullStr = Number(remNull.toFixed(2)).toString();
  
  if (Math.abs(nullFrac - 0.5) < 0.01) {
    remNullStr = nullInt > 0 ? `${nullInt} ½` : `½`;
  }

  if (inch > 0 && remNull > 0) {
    return `${inch} ${inchStr} ${remNullStr} ${nullStr}`;
  } else if (inch > 0) {
    return `${inch} ${inchStr}`;
  } else {
    return `${remNullStr} ${nullStr}`;
  }
}

function toFractionalInch(x) {
  if (Math.abs(x) < 0.0001) return '0"';
  let total16ths = Math.round(x * 16);
  let inches = Math.floor(total16ths / 16);
  let rem16ths = total16ths % 16;

  if (rem16ths === 0) return `${inches}"`;

  let num = rem16ths, den = 16;
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  let g = gcd(num, den);
  num /= g;
  den /= g;

  let fracStr = `${num}/${den}`;
  const unicodeMap = {
    '1/2': '½', '1/4': '¼', '3/4': '¾',
    '1/8': '⅛', '3/8': '⅜', '5/8': '⅝', '7/8': '⅞'
  };

  let displayFrac = unicodeMap[fracStr] || fracStr;
  return inches > 0 ? `${inches} ${displayFrac}"` : `${displayFrac}"`;
}

function toMM(x) {
  let mm = x * 25.4;
  return (Math.round(mm * 10) / 10) + ' mm';
}

function roundToStep(x, unitMode) {
  let step = (unitMode === 'mm') ? (0.5 * MM_TO_INCH) : HALF_NULL;
  let r = Math.round(x / step) * step;
  return r < 0 ? 0 : r;
}

function solveForN(f, b, n, unitMode) {
  if (n <= 0) return null;
  let exactG = (f - n * b) / (n + 1);
  if (exactG < 0) return null;
  let g = roundToStep(exactG, unitMode);
  let calculatedTotal = n * b + (n + 1) * g;
  
  let rawDiff = f - calculatedTotal; 
  let diff = Math.abs(rawDiff);
  
  return { n, g, calculatedTotal, diff, rawDiff, exact: diff < 0.0001 };
}

function gapPriority(f, b, gs, gm, unitMode) {
  let maxN = Math.floor(f / b);
  let candidates = [];
  for (let n = maxN; n >= 1; n--) {
    let res = solveForN(f, b, n, unitMode);
    if (!res) continue;
    if (res.g >= gs - 0.0001 && res.g <= gm + 0.0001) candidates.push(res);
  }
  if (candidates.length) {
    let exactMatch = candidates.find(c => c.exact);
    return exactMatch || candidates[0];
  }

  let best = null, d = 1e9;
  let step = (unitMode === 'mm') ? (0.5 * MM_TO_INCH) : HALF_NULL;

  for (let g = gs; g <= gm + 0.0001; g += step) {
    let n = Math.floor((f - g) / (b + g));
    if (n > 0) {
      let u = n * b + (n + 1) * g;
      let rawDiff = f - u;
      let diff = Math.abs(rawDiff);
      if (diff < d) {
        d = diff;
        best = { n, g, diff, rawDiff, calculatedTotal: u };
      }
    }
  }
  if (best) return { ...best, exact: false };
  return null;
}

function pipePriority(f, b, n, unitMode) {
  return solveForN(f, b, n, unitMode);
}

function calculate() {
  const panel = document.getElementById("outputPanel");
  const content = document.getElementById("outputContent");
  const unitMode = getSelectedUnit();
  const t = translations[currentLang];

  try {
    let f = parseMeasurement(document.getElementById("frame").value, unitMode);
    let b = parseMeasurement(document.getElementById("bar").value, unitMode);
    let m = document.querySelector("input[name=mode]:checked").value;

    if (isNaN(f) || isNaN(b) || f <= 0 || b <= 0) throw "Invalid";

    let html = "";
    let res = null;

    if (m === "gap") {
      let gs = parseMeasurement(document.getElementById("gapStart").value, unitMode);
      let gm = parseMeasurement(document.getElementById("gapMax").value, unitMode);
      if (isNaN(gs) || isNaN(gm)) throw "Invalid";

      res = gapPriority(f, b, gs, gm, unitMode);
      if (!res) {
        content.innerHTML = `<div style="text-align:center; color:var(--error); padding: 8px 0;">No practical gap found in range.</div>`;
        panel.classList.add("visible");
        return;
      }
    } else {
      let pc = parseInt(document.getElementById("pipeCount").value);
      if (isNaN(pc) || pc <= 0) throw "Invalid";
      
      let pRes = pipePriority(f, b, pc, unitMode);
      if (!pRes) {
        content.innerHTML = `<div style="text-align:center; color:var(--error); padding: 8px 0;">Material quantity exceeds total span.</div>`;
        panel.classList.add("visible");
        return;
      }
      res = { n: pc, g: pRes.g, rawDiff: pRes.rawDiff, exact: pRes.exact, diff: pRes.diff, calculatedTotal: pRes.calculatedTotal };
    }

    let primaryGapStr = unitMode === 'mm' ? toMM(res.g) : toFractionalInch(res.g);
    let msgGapStr = unitMode === 'mm' ? toMM(res.g) : (currentLang === 'en' ? toFractionalInch(res.g) : toInchNull(res.g));
    let msgDiffStr = unitMode === 'mm' ? toMM(res.diff) : (currentLang === 'en' ? toFractionalInch(res.diff) : toInchNull(res.diff));

    let friendlyMsg = "";
    if (res.exact) {
      friendlyMsg = t.msg_perfect
        .replace('{n}', `<strong>${res.n}</strong>`)
        .replace('{gap}', `<strong>${msgGapStr}</strong>`);
    } else {
      let msgTemplate = res.rawDiff > 0 ? t.msg_manage_more : t.msg_manage_less;
      friendlyMsg = msgTemplate
        .replace('{n}', `<strong>${res.n}</strong>`)
        .replace('{gap}', `<strong>${msgGapStr}</strong>`)
        .replace('{diff}', `<strong>${msgDiffStr}</strong>`);
    }

    let diffIndicator = "";
    if (!res.exact) {
      diffIndicator = res.rawDiff > 0 ? t.diff_more_badge : t.diff_less_badge;
    }

    html = `
      <!-- 1. TOP CONVERSATIONAL SUMMARY MESSAGE -->
      <div class="friendly-msg-card">
        <span class="msg-icon">💡</span>
        <span class="msg-text">${friendlyMsg}</span>
      </div>

      <!-- 2. HIGH PRIORITY WARNING BANNER (MARK GAPS FIRST) -->
      <div class="warning-alert-card">
        <span class="warn-icon">⚠️</span>
        <div class="warn-body">${t.warning_mark_gaps}</div>
      </div>

      <!-- 3. PRIMARY MEASUREMENT CARDS -->
      <div class="primary-card">
        <div class="card-title">${t.req_gap}</div>
        <div class="main-val">${primaryGapStr}</div>
        <div class="unit-pills">
          <div class="pill"><span>Frac:</span> ${toFractionalInch(res.g)}</div>
          ${currentLang !== 'en' ? `<div class="pill"><span>${t.null_pill}</span> ${toInchNull(res.g)}</div>` : `<div class="pill"><span>Dec:</span> ${res.g.toFixed(3)}"</div>`}
          <div class="pill"><span>MM:</span> ${toMM(res.g)}</div>
        </div>
      </div>

      <div class="result-grid">
        <div class="stat-box">
          <div class="stat-label">${t.mat_qty}</div>
          <div class="stat-val">${res.n} Units</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">${t.fit_status}</div>
          <div>
            <span class="status-badge ${res.exact ? 'status-success' : 'status-warn'}">
              ${res.exact ? t.perfect_fit : t.approx_fit}
            </span>
          </div>
        </div>
      </div>

      <div class="diff-card">
        <div class="diff-header">
          <span class="diff-title">${t.diff}</span>
          <span class="diff-main-val" style="color: ${res.exact ? 'var(--text-main)' : '#FACC15'};">
            ${res.exact ? '0' : `
              ${unitMode === 'mm' ? toMM(res.diff) : toFractionalInch(res.diff)} 
              <span style="font-size:10px; opacity:0.8; font-weight:normal;">(${diffIndicator})</span>
            `}
          </span>
        </div>
        ${!res.exact ? `
          <div class="unit-pills">
            <div class="pill"><span>Frac:</span> ${toFractionalInch(res.diff)}</div>
            ${currentLang !== 'en' ? `<div class="pill"><span>${t.null_pill}</span> ${toInchNull(res.diff)}</div>` : ''}
            <div class="pill"><span>MM:</span> ${toMM(res.diff)}</div>
          </div>
        ` : ''}
      </div>
    `;

    content.innerHTML = html;
    panel.classList.add("visible");
    
    setTimeout(() => {
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 80);

  } catch(e) {
    content.innerHTML = `<div style="text-align:center; color:var(--error); padding: 8px 0;">⚠ Please check input measurements</div>`;
    panel.classList.add("visible");
  }
}

// --- DOCKED VIRTUAL INCH & FRACTION KEYBOARD ENGINE ---

function preventBlur(e) {
  e.preventDefault();
}

function setupInputs() {
  const inputs = document.querySelectorAll('.container input[type="text"], .container input[type="number"]');
  inputs.forEach(input => {
    input.addEventListener('pointerdown', (e) => {
      if(!document.getElementById('wtOverlay').classList.contains('hidden')) return;
      openKeyboard(input);
    });
    input.addEventListener('click', (e) => {
      if(!document.getElementById('wtOverlay').classList.contains('hidden')) return;
      openKeyboard(input);
    });
  });

  document.addEventListener('pointerdown', (e) => {
    const kb = document.getElementById('customKb');
    if(!document.getElementById('wtOverlay').classList.contains('hidden')) return;

    if (!kb.contains(e.target) && !e.target.matches('input') && !e.target.matches('.segment-label') && !e.target.matches('.lang-select') && !e.target.matches('.lang-icon') && !e.target.matches('.help-btn')) {
      closeKeyboard(false);
    }
  });
}

function openKeyboard(inputElem) {
  if (!inputElem) return;

  document.querySelectorAll('.container input').forEach(i => {
    i.classList.remove('active-input');
  });

  activeInput = inputElem;
  activeInput.classList.add('active-input');

  const unitMode = getSelectedUnit();
  const labelObj = document.querySelector(`label[for="${inputElem.id}"]`) || 
                   inputElem.previousElementSibling || 
                   inputElem.parentElement.querySelector('label');
                   
  const t = translations[currentLang];
  const titleText = labelObj ? labelObj.innerText : t.edit_input;
  
  document.getElementById('kbTargetTitle').innerText = titleText;
  document.getElementById('kbUnitBadge').innerText = unitMode === 'mm' ? 'MM MODE' : 'INCH MODE';
  
  renderKeyboardKeys();
  document.getElementById('customKb').classList.add('active');

  // Prevent keyboard from covering active input
  document.getElementById('appScrollArea').style.paddingBottom = '340px';

  setTimeout(() => {
    inputElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}

function closeKeyboard(shouldCalculate = false) {
  document.getElementById('customKb').classList.remove('active');
  document.getElementById('appScrollArea').style.paddingBottom = '40px';

  document.querySelectorAll('.container input').forEach(i => {
    i.classList.remove('active-input');
  });
  activeInput = null;
  if (shouldCalculate) {
    calculate();
  }
}

function isFractionKey(k) {
  return ['⅛', '¼', '⅜', '½', '⅝', '¾', '⅞', '1/16', '3/16', '5/16', '7/16', '9/16', '11/16', '13/16', '15/16'].includes(k);
}

function handleKey(key) {
  if (!activeInput) return;
  
  let val = activeInput.value;
  let start = activeInput.selectionStart !== null ? activeInput.selectionStart : val.length;
  let end = activeInput.selectionEnd !== null ? activeInput.selectionEnd : val.length;
  
  const nullStr = getNullStr();
  const inchStr = getInchStr();

  if (key === 'BACK') {
    if (start === end) {
      if (start > 0) {
        activeInput.value = val.slice(0, start - 1) + val.slice(start);
        let newPos = start - 1;
        try { activeInput.setSelectionRange(newPos, newPos); } catch(e){}
      }
    } else {
      activeInput.value = val.slice(0, start) + val.slice(end);
      try { activeInput.setSelectionRange(start, start); } catch(e){}
    }
  } else if (key === 'CLEAR') {
    activeInput.value = '';
    try { activeInput.setSelectionRange(0, 0); } catch(e){}
  } else {
    let insertStr = key;
    
    // Automatically add space before inch, null, or mm if preceded by non-space
    if ((key === nullStr || key === inchStr || key === 'mm') && start > 0 && val.charAt(start - 1) !== ' ') {
      insertStr = ' ' + key;
    } else if (isFractionKey(key) && start > 0 && /\d/.test(val.charAt(start - 1))) {
      insertStr = ' ' + key;
    }

    activeInput.value = val.slice(0, start) + insertStr + val.slice(end);
    let newPos = start + insertStr.length;
    try { activeInput.setSelectionRange(newPos, newPos); } catch(e){}
  }

  activeInput.dispatchEvent(new Event('input', { bubbles: true }));
}

function navField(dir) {
  const visibleInputs = Array.from(document.querySelectorAll('.container input[type="text"], .container input[type="number"]'))
    .filter(input => input.offsetParent !== null);
    
  if (visibleInputs.length === 0) return;

  let idx = activeInput ? visibleInputs.indexOf(activeInput) : -1;
  let nextIdx = idx + dir;

  if (nextIdx < 0) nextIdx = visibleInputs.length - 1;
  if (nextIdx >= visibleInputs.length) nextIdx = 0;

  openKeyboard(visibleInputs[nextIdx]);
}

window.onload = function() {
  toggleInputs();
  setupInputs();
  
  const savedLang = localStorage.getItem('gapCalcLang');
  if (savedLang) {
    const langSelect = document.getElementById('langSelect');
    if (Array.from(langSelect.options).some(opt => opt.value === savedLang)) {
      langSelect.value = savedLang;
    }
  }

  changeLanguage();

  if (!localStorage.getItem('gapCalcTourDone')) {
    startWalkthrough(0);
  }
};
